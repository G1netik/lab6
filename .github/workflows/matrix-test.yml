name: Matrix Test

on:
  push:
    branches: [ main ]

jobs:
  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check Python
        run: python --version

      - name: Show system
        run: echo "Running on ${{ matrix.os }}"
